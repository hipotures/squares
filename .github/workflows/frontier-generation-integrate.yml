name: Frontier generation integration
on:
  push:
    branches: [work/frontier-autonomy]
    paths: [.github/workflows/frontier-generation-integrate.yml, .github/frontier-generation-upgrade.py]
permissions:
  contents: write
concurrency:
  group: frontier-generation-integration
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACK_JOBS: '2'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Apply generation integration
        run: uv run --project packing --frozen python .github/frontier-generation-upgrade.py
      - name: Locked environment
        working-directory: packing
        run: uv sync --frozen
      - name: Test generation queue and existing autonomy contracts
        working-directory: packing
        run: |
          set -euo pipefail
          mkdir -p ../generation-artifacts
          uv run --frozen python -m compileall -q devtools/frontier_generation*.py devtools/frontier_phase.py devtools/run_n12_frontier.py devtools/run_fractional_colgen.py src/sqpack/fractional/colgen.py
          uv run --frozen ruff check --select F,E9 devtools/frontier_generation*.py devtools/frontier_phase.py tests/test_frontier_generation_queue.py
          uv run --frozen pytest tests/test_frontier_generation_queue.py tests/test_run_n12_frontier.py tests/test_frontier_autonomy.py tests/test_frontier_hardening.py tests/test_frontier_runtime_hardening.py tests/test_frontier_boost_queue.py tests/test_frontier_repair_batch.py -q --junitxml=../generation-artifacts/autonomy.xml 2>&1 | tee ../generation-artifacts/autonomy.log
          uv run --frozen pytest tests/test_run_fractional_colgen.py tests/test_colgen_parallel_directions.py tests/test_colgen_persistent_lp.py tests/test_fractional_generate.py tests/test_declare_least_cell_mass.py -q --junitxml=../generation-artifacts/generator.xml 2>&1 | tee ../generation-artifacts/generator.log
          uv run --frozen python -m devtools.run_n12_frontier --help > ../generation-artifacts/help.txt
      - name: Publish only tested source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packing/devtools/frontier_generation_queue.py packing/devtools/frontier_generation_campaign.py packing/devtools/frontier_phase.py packing/devtools/run_n12_frontier.py packing/devtools/run_fractional_colgen.py packing/devtools/frontier_runtime.py packing/src/sqpack/fractional/colgen.py packing/tests/test_frontier_generation_queue.py
          git commit -m 'feat: integrate CPU-budgeted generation cohorts and epoch phase logs' -m 'Refs #3 and PR #4. Only generated search artifacts are interpreted by the existing full proof gate.'
          git push origin HEAD:work/frontier-autonomy
      - name: Preserve exact tested changes
        if: always()
        run: |
          mkdir -p generation-artifacts
          git rev-parse HEAD > generation-artifacts/tested-commit.txt
          git diff > generation-artifacts/tested.patch
          git status --short > generation-artifacts/status.txt
          sha256sum packing/devtools/frontier_generation*.py packing/devtools/frontier_phase.py packing/src/sqpack/fractional/colgen.py > generation-artifacts/source.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontier-generation-integration
          path: generation-artifacts/
          retention-days: 30
