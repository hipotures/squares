name: Native A/B validation
on:
  push:
    branches: [work/frontier-native-ab]
    paths: ['packing/**', '.github/workflows/native-ab.yml']
  pull_request:
    branches: [work/frontier-autonomy]
    paths: ['packing/**', '.github/workflows/native-ab.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ab-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACK_JOBS: '2'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
          sparse-checkout: |
            packing/src
            packing/devtools
            packing/tests
            packing/cases/n12_fractional_certificate
            packages/workbench
            vendor/kpress
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Build native libraries and verify source quality
        working-directory: packing
        run: |
          set -euo pipefail
          if ! test -f /usr/include/boost/multiprecision/cpp_int.hpp; then
            sudo apt-get update -qq
            sudo apt-get install -y libboost-dev
          fi
          mkdir -p ../native-ab-artifacts
          uv sync --frozen
          uv run --frozen python -m devtools.native_ab build > ../native-ab-artifacts/build.json
          uv run --frozen python -m devtools.native_ab doctor --native all > ../native-ab-artifacts/doctor.json
          uv run --frozen python -m compileall -q src/sqpack/fractional devtools/native_ab.py devtools/native_ab_replay.py devtools/bench_native_ab.py
          uv run --frozen ruff format --check src/sqpack/fractional/native_ab_*.py devtools/native_ab*.py devtools/bench_native_ab.py tests/test_native_ab*.py
          uv run --frozen ruff check --select F,E9 src/sqpack/fractional/native_ab_*.py devtools/native_ab*.py devtools/bench_native_ab.py tests/test_native_ab*.py
      - name: Native address and undefined-behavior sanitizers
        working-directory: packing
        run: |
          set -euo pipefail
          for source in native_ab_core _prefix_rows_native _top13; do
            cc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -ffp-contract=off -c src/sqpack/fractional/$source.c -o ../native-ab-artifacts/$source.o
          done
          c++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer tests/native_ab_sanitizer.cpp src/sqpack/fractional/native_ab_exact.cpp ../native-ab-artifacts/*.o -o ../native-ab-artifacts/native-sanitizer
          ASAN_OPTIONS=detect_leaks=1 ../native-ab-artifacts/native-sanitizer
          echo 'ASan and UBSan passed' > ../native-ab-artifacts/sanitizers.txt
      - name: Native differential, real replay, telemetry and graceful resume tests
        working-directory: packing
        run: |
          set -euo pipefail
          uv run --frozen pytest tests/test_native_ab_kernels.py tests/test_native_ab_sessions.py -q --junitxml=../native-ab-artifacts/native.xml 2>&1 | tee ../native-ab-artifacts/native.log
      - name: Frontier and generator regressions
        working-directory: packing
        run: |
          set -euo pipefail
          uv run --frozen pytest tests/test_run_n12_frontier.py tests/test_frontier_autonomy.py tests/test_frontier_hardening.py tests/test_frontier_runtime_hardening.py tests/test_frontier_boost_queue.py tests/test_frontier_repair_batch.py tests/test_frontier_generation_queue.py tests/test_frontier_generation_recovery.py tests/test_frontier_strategy_frontiers.py tests/test_exact_slabs.py tests/test_run_fractional_colgen.py tests/test_colgen_parallel_directions.py tests/test_colgen_persistent_lp.py tests/test_fractional_generate.py tests/test_declare_least_cell_mass.py -q --junitxml=../native-ab-artifacts/regression.xml 2>&1 | tee ../native-ab-artifacts/regression.log
          PACK_NATIVE_KERNELS=all uv run --frozen pytest tests/test_frontier_generation_queue.py tests/test_frontier_generation_recovery.py -q --junitxml=../native-ab-artifacts/native-generation.xml 2>&1 | tee ../native-ab-artifacts/native-generation.log
      - name: Short matched service and instrumentation controls
        working-directory: packing
        run: |
          set -euo pipefail
          uv run --frozen python -m devtools.bench_native_ab --root ../native-ab-artifacts/controls --seconds 10 --workers 2 --overhead-repetitions 100 | tee ../native-ab-artifacts/controls.log
          uv run --frozen python -m devtools.native_ab replay --corpus ../native-ab-artifacts/controls/corpus --output ../native-ab-artifacts/replay16 --native all --workers 16 --minutes 0 --rounds 2 --label sixteen-process-correctness | tee ../native-ab-artifacts/replay16.log
      - name: Record final tested revision
        if: always()
        run: |
          mkdir -p native-ab-artifacts
          git rev-parse HEAD > native-ab-artifacts/tested-commit.txt
          git status --short > native-ab-artifacts/working-tree.txt
          rm -f native-ab-artifacts/*.o native-ab-artifacts/native-sanitizer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-ab-${{ github.sha }}
          path: native-ab-artifacts/
          retention-days: 30
