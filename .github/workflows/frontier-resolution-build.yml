name: Prepare frontier resolution change
on:
  push:
    branches: [work/frontier-resolution-build-20260927]
    paths:
      - 'packing/devtools/_apply_frontier_resolution.py'
      - 'packing/devtools/frontier_resolution.py'
      - 'packing/tests/test_frontier_resolution.py'
      - '.github/workflows/frontier-resolution-build.yml'
permissions:
  contents: write
concurrency:
  group: frontier-resolution-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'hipotures/squares' && github.ref == 'refs/heads/work/frontier-resolution-build-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PACK_JOBS: '2'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
          submodules: recursive
          sparse-checkout: |
            packing/src
            packing/devtools
            packing/tests
            packing/cases/n12_fractional_certificate
            Experiments/n12-frontier-resolution
            packages/workbench
            vendor/kpress
            .github/workflows
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.8'
          python-version: '3.14'
          enable-cache: false
      - name: Apply guarded changes and check source
        working-directory: packing
        run: |
          set -euo pipefail
          mkdir -p ../resolution-artifacts
          uv sync --frozen
          uv run --frozen python devtools/_apply_frontier_resolution.py apply
          uv run --frozen ruff format devtools/frontier_resolution.py tests/test_frontier_resolution.py
          uv run --frozen python -m compileall -q devtools/frontier_resolution.py devtools/frontier_policy.py devtools/run_n12_frontier.py tests/test_frontier_resolution.py
          uv run --frozen ruff check --select F,E9 devtools/frontier_resolution.py devtools/frontier_policy.py devtools/run_n12_frontier.py tests/test_frontier_resolution.py
          uv run --frozen basedpyright devtools/frontier_resolution.py
          git diff --check
          git diff > ../resolution-artifacts/changes.patch
      - name: Automatic resolution and controller regressions
        working-directory: packing
        run: |
          set -euo pipefail
          uv run --frozen pytest tests/test_frontier_resolution.py tests/test_run_n12_frontier.py tests/test_frontier_strategy_frontiers.py tests/test_frontier_generation_recovery.py tests/test_frontier_utilization.py tests/test_frontier_hardening.py -q --basetemp=../resolution-artifacts/pytest --junitxml=../resolution-artifacts/tests.xml 2>&1 | tee ../resolution-artifacts/tests.log
      - name: Create tested candidate objects without changing a branch
        working-directory: packing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --frozen python devtools/_apply_frontier_resolution.py publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontier-resolution-preparation-${{ github.sha }}
          path: |
            resolution-artifacts/tests.log
            resolution-artifacts/tests.xml
            resolution-artifacts/changes.patch
            resolution-artifacts/candidate-sha.txt
          retention-days: 14
