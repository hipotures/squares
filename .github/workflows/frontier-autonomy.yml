name: Frontier autonomy

on:
  push:
    branches: [main, work/frontier-autonomy]
    paths:
      - 'packing/devtools/*frontier*'
      - 'packing/devtools/frontier/**'
      - 'packing/tests/test*frontier*'
      - '.github/workflows/frontier-autonomy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontier-autonomy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACK_JOBS: '2'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          sparse-checkout: |
            packing/src
            packing/devtools
            packing/tests
            packing/cases/n12_fractional_certificate
            packages/workbench
            vendor/kpress
      - name: Preserve the exact reviewed source subset
        run: |
          mkdir -p frontier-artifacts
          git archive HEAD packing/src packing/devtools packing/tests/test_run_n12_frontier.py packing/cases/n12_fractional_certificate packing/pyproject.toml packing/uv.lock packing/hatch_build.py > frontier-artifacts/reviewed-source.tar
          git rev-parse HEAD > frontier-artifacts/commit.txt
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Install locked project
        working-directory: packing
        run: uv sync --frozen
      - name: Run focused frontier tests
        working-directory: packing
        run: |
          set -o pipefail
          uv run --frozen pytest tests/test*frontier*.py -q --junitxml=../frontier-artifacts/pytest.xml 2>&1 | tee ../frontier-artifacts/tests.log
          uv run --frozen python -m devtools.run_n12_frontier --help > ../frontier-artifacts/help.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-autonomy-${{ github.sha }}
          path: frontier-artifacts/
          retention-days: 14
