name: Frontier autonomy

on:
  push:
    branches: [main, work/frontier-autonomy]
    paths: ['packing/**', 'packages/workbench/**', '.github/workflows/frontier-autonomy.yml']
  pull_request:
    paths: ['packing/**', 'packages/workbench/**', '.github/workflows/frontier-autonomy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontier-autonomy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACK_JOBS: '2'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
          sparse-checkout: |
            packing/src
            packing/devtools
            packing/tests
            packing/cases/n12_fractional_certificate
            packages/workbench
            vendor/kpress
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Install locked project
        working-directory: packing
        run: uv sync --frozen
      - name: Syntax and lint
        working-directory: packing
        run: |
          set -euo pipefail
          mkdir -p ../frontier-artifacts
          uv run --frozen python -m compileall -q devtools/run_n12_frontier.py devtools/frontier_*.py devtools/bench_frontier_dispatch.py devtools/bench_frontier_generation.py devtools/run_fractional_colgen.py src/sqpack/fractional/colgen.py
          uv run --frozen ruff check --select F,E9 devtools/run_n12_frontier.py devtools/frontier_*.py devtools/bench_frontier_dispatch.py devtools/bench_frontier_generation.py devtools/run_fractional_colgen.py src/sqpack/fractional/colgen.py tests/test_run_n12_frontier.py tests/test_frontier_autonomy.py tests/test_frontier_hardening.py tests/test_frontier_runtime_hardening.py tests/test_frontier_boost_queue.py tests/test_frontier_repair_batch.py tests/test_frontier_generation_queue.py tests/test_frontier_generation_recovery.py tests/test_frontier_strategy_frontiers.py | tee ../frontier-artifacts/lint.log
      - name: Autonomy, shared generation, recovery, repair and exact-gate smoke tests
        working-directory: packing
        run: |
          set -euo pipefail
          uv run --frozen pytest tests/test_run_n12_frontier.py tests/test_frontier_autonomy.py tests/test_frontier_hardening.py tests/test_frontier_runtime_hardening.py tests/test_frontier_boost_queue.py tests/test_frontier_repair_batch.py tests/test_frontier_generation_queue.py tests/test_frontier_generation_recovery.py tests/test_frontier_strategy_frontiers.py -q --junitxml=../frontier-artifacts/autonomy.xml 2>&1 | tee ../frontier-artifacts/autonomy.log
          uv run --frozen python -m devtools.run_n12_frontier --help > ../frontier-artifacts/help.txt
      - name: Generator, persistent LP and separation regression
        working-directory: packing
        run: |
          set -euo pipefail
          uv run --frozen pytest tests/test_run_fractional_colgen.py tests/test_colgen_parallel_directions.py tests/test_colgen_persistent_lp.py tests/test_fractional_generate.py tests/test_declare_least_cell_mass.py -q --junitxml=../frontier-artifacts/generator.xml 2>&1 | tee ../frontier-artifacts/generator.log
      - name: Real generator shared-versus-sequential control
        working-directory: packing
        run: |
          set -euo pipefail
          uv run --frozen python -m devtools.bench_frontier_generation --root ../frontier-artifacts/generation-paired --workers 2 --samples 1 --target-seconds 12 | tee ../frontier-artifacts/generation-benchmark.log
      - name: Synthetic dispatcher service-rate control (not solver scaling)
        working-directory: packing
        run: |
          set -euo pipefail
          uv run --frozen python -m devtools.bench_frontier_dispatch --workers 16 --samples 3 --target-seconds 12 --service-only --output ../frontier-artifacts/dispatch-service.json | tee ../frontier-artifacts/dispatch-service.log
      - name: Record tested revision
        if: always()
        run: |
          mkdir -p frontier-artifacts
          git rev-parse HEAD > frontier-artifacts/tested-commit.txt
          git status --short > frontier-artifacts/working-tree.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontier-autonomy-${{ github.sha }}
          path: frontier-artifacts/
          retention-days: 30
