name: Frontier policy source snapshot
on:
  push:
    branches: [work/frontier-autonomy]
    paths: [.github/workflows/frontier-policy-export.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            packing/src
            packing/devtools
            packing/tests
            packing/cases/n12_fractional_certificate
            packages/workbench
            .github/workflows
      - name: Export tracked development source only
        run: |
          mkdir -p "$RUNNER_TEMP/frontier-source"
          git rev-parse HEAD > "$RUNNER_TEMP/frontier-source/commit.txt"
          git ls-files -s > "$RUNNER_TEMP/frontier-source/tree.txt"
          tar --exclude='__pycache__' -czf "$RUNNER_TEMP/frontier-source/source.tar.gz" packing/src packing/devtools packing/tests packing/cases/n12_fractional_certificate packing/pyproject.toml packing/uv.lock packing/.python-version packages/workbench .github/workflows AGENTS.md development.md operating-rules.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontier-policy-source
          path: ${{ runner.temp }}/frontier-source/
          retention-days: 2
