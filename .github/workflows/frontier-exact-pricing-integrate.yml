name: Frontier exact pricing integration
on:
  push:
    branches: [work/frontier-autonomy]
    paths: ['.github/frontier-exact-pricing.patch', '.github/workflows/frontier-exact-pricing-integrate.yml']
permissions:
  contents: write
concurrency:
  group: frontier-exact-pricing-integration
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PACK_JOBS: '2'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Apply reviewed exact-equivalent integration
        run: |
          set -euo pipefail
          test "$(git hash-object packing/src/sqpack/fractional/colgen.py)" = 91620323e9cbd4d0223e9a08f1cbec12519fb458
          git apply --check .github/frontier-exact-pricing.patch
          git apply .github/frontier-exact-pricing.patch
          python - <<'PY'
          from pathlib import Path
          path = Path('packing/devtools/bench_exact_pricing.py')
          text = path.read_text()
          text = text.replace("base + ['--child', mode, '--root', str(directory)]", "[*base, '--child', mode, '--root', str(directory)]")
          text = text.replace("'paired identical full generator inputs, includes process startup; not a live campaign'", "'paired full generator, includes startup; not a live campaign'")
          text = text.replace("'identical ordered rounds, objectives, exact ceiling and frozen certificate'", "'identical rounds, objectives, ceiling and frozen certificate'")
          path.write_text(text)
          PY
      - name: Locked environment and new-file quality checks
        working-directory: packing
        run: |
          set -euo pipefail
          uv sync --frozen
          uv run --frozen ruff format src/sqpack/fractional/exact_slabs.py devtools/bench_exact_pricing.py tests/test_exact_slabs.py
          uv run --frozen ruff check --fix src/sqpack/fractional/exact_slabs.py devtools/bench_exact_pricing.py tests/test_exact_slabs.py
          uv run --frozen basedpyright src/sqpack/fractional/exact_slabs.py devtools/bench_exact_pricing.py tests/test_exact_slabs.py
      - name: Exact equivalence and existing frontier regression
        working-directory: packing
        run: |
          set -euo pipefail
          mkdir -p ../exact-pricing-artifacts
          uv run --frozen python -m compileall -q src/sqpack/fractional/exact_slabs.py src/sqpack/fractional/colgen.py
          uv run --frozen pytest tests/test_exact_slabs.py tests/test_run_n12_frontier.py tests/test_frontier_autonomy.py tests/test_frontier_hardening.py tests/test_frontier_runtime_hardening.py tests/test_frontier_boost_queue.py tests/test_frontier_repair_batch.py tests/test_frontier_generation_queue.py tests/test_frontier_generation_recovery.py tests/test_frontier_strategy_frontiers.py -q --junitxml=../exact-pricing-artifacts/frontier.xml | tee ../exact-pricing-artifacts/frontier.log
          uv run --frozen pytest tests/test_run_fractional_colgen.py tests/test_colgen_parallel_directions.py tests/test_colgen_persistent_lp.py tests/test_fractional_generate.py tests/test_declare_least_cell_mass.py -q --junitxml=../exact-pricing-artifacts/generator.xml | tee ../exact-pricing-artifacts/generator.log
          uv run --frozen python -m devtools.bench_exact_pricing --root ../exact-pricing-artifacts/paired --workers 2 --samples 1 | tee ../exact-pricing-artifacts/benchmark.log
      - name: Publish only tested source to the existing branch
        run: |
          set -euo pipefail
          git fetch origin work/frontier-autonomy
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packing/src/sqpack/fractional/colgen.py packing/src/sqpack/fractional/exact_slabs.py packing/devtools/bench_exact_pricing.py packing/tests/test_exact_slabs.py
          git commit -m 'perf: prepare exact slab predicates for pricing and ceiling' -m 'Refs #3 and PR #4. Preserve float ranking, exact candidate/certificate results, and CPU budgets. Tested before publication.'
          git push origin HEAD:work/frontier-autonomy
      - name: Preserve tested source and revision
        if: always()
        run: |
          mkdir -p exact-pricing-artifacts
          git rev-parse HEAD > exact-pricing-artifacts/commit.txt
          git diff > exact-pricing-artifacts/tested.patch
          git status --short > exact-pricing-artifacts/status.txt
          tar -czf exact-pricing-artifacts/source.tar.gz packing/src/sqpack/fractional/colgen.py packing/src/sqpack/fractional/exact_slabs.py packing/devtools/bench_exact_pricing.py packing/tests/test_exact_slabs.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontier-exact-pricing-integration
          path: exact-pricing-artifacts/
          retention-days: 30
